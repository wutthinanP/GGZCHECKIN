version: "3.9"

services:
  # ─── PostgreSQL Database ───
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: checkin404
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkin404"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Node.js Backend (Express API) ───
  backend:
    build: ./B_END
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 1234
      DB_NAME: checkin404
      JWT_SECRET: your_jwt_secret
      ACCESS_TOKEN_EXPIRE: 15m
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # ─── React Frontend (nginx) ───
  frontend:
    build: ./F_END
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
